<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Skærmkort</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="admin">
  <div class="shell">
    <aside class="side">
      <h1>Skærmkort</h1>
      <p class="lead">Kunder efter CVR. Listen er delt i landsdele.</p>
      <p id="cfgwarn" class="warn hidden">Indsæt Firebase-nøgler i firebase-config.js</p>
      <button type="button" class="ghost light" id="newbtn">+ Ny kunde</button>
      <button type="button" class="ghost light" id="seed">Opret testkunder</button>
      <section class="side-form hidden" id="create">
        <h2>Ny kunde</h2>
        <label>CVR eller kundenummer (valgfrit) <input id="cvr" placeholder="kan udfyldes senere" /></label>
        <label>Firmanavn / pizzeria <input id="cname" /></label>
        <label>Adresse <input id="caddr" /></label>
        <label>By <input id="ccity" /></label>
        <label>Landsdel
          <select id="cregion">
            <option>Nordjylland</option>
            <option>Midtjylland</option>
            <option>Sønderjylland</option>
            <option>Fyn</option>
            <option>Sjælland</option>
            <option>Lolland-Falster</option>
            <option>Bornholm</option>
          </select>
        </label>
        <label>Antal skærme <input id="cscreens" type="number" min="1" value="1" /></label>
        <label>Telefon <input id="cphone" /></label>
        <button type="button" class="primary" id="createbtn">Gem kunde</button>
        <button type="button" class="ghost light" id="closecreate">Annuller</button>
        <p id="cmsg"></p>
      </section>
      <div id="list" class="cust-list"></div>
    </aside>
    <div class="main">
      <div id="map"></div>
      <section class="panel hidden" id="panel">
        <button type="button" class="close" id="close">Luk</button>
        <h2 id="pname"></h2>
        <p id="pcity" class="muted"></p>
        <div id="pscreens" class="screens"></div>
        <p class="tv-url muted" id="tvurl"></p>
        <button type="button" class="ghost" id="placebtn">Placer kunden på kortet</button>
        <p class="muted" id="placehint"></p>
        <div id="preview" class="preview"></div>
        <label>Firmanavn <input id="ename" /></label>
        <label>Adresse <input id="eaddr" /></label>
        <label>By <input id="ecity" /></label>
        <label>Landsdel
          <select id="eregion">
            <option>Nordjylland</option>
            <option>Midtjylland</option>
            <option>Sønderjylland</option>
            <option>Fyn</option>
            <option>Sjælland</option>
            <option>Lolland-Falster</option>
            <option>Bornholm</option>
          </select>
        </label>
        <label>Antal skærme <input id="escreens" type="number" min="1" /></label>
        <label>Telefon <input id="ephone" /></label>
        <label>Overskrift på TV <input id="venue" /></label>
        <label>Lysavis <input id="ticker" /></label>
        <label>Note <input id="footerNote" /></label>
        <div class="row-between">
          <h3>Retter</h3>
          <button type="button" class="ghost" id="add">+ Tilføj menu</button>
        </div>
        <div id="items"></div>
        <div class="actions">
          <button type="button" class="primary" id="save">Gem og send</button>
          <button type="button" class="ghost" id="delcust">Slet kunde</button>
          <span id="msg"></span>
        </div>
      </section>
    </div>
  </div>
  <div id="studio" class="studio hidden">
    <div class="studio-bar">
      <strong>Skriv på skærmen</strong>
      <span id="stitle"></span>
      <button type="button" class="ghost" id="sadd">+ Ny ret</button>
      <label class="cols">Kolonner
        <select id="scols">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
        </select>
      </label>
      <button type="button" class="primary" id="ssave">Send til TV</button>
      <button type="button" class="ghost" id="sclose">Luk</button>
    </div>
    <div class="tv-frame">
      <div class="tv-top">
        <input id="svenue" placeholder="Overskrift" />
        <input id="ssub" placeholder="Undertitel" />
      </div>
      <div id="sgrid" class="tv-grid cols-2"></div>
      <div class="tv-tick"><input id="sticker" placeholder="Lysavis nederst" /></div>
    </div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
