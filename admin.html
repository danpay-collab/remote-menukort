<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Skærmkort</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="admin">
  <div class="shell">
    <aside class="side">
      <h1>Skærmkort</h1>
      <p class="lead">Kunder efter CVR. Listen er delt i landsdele.</p>
      <p id="cfgwarn" class="warn hidden">Indsæt Firebase-nøgler i firebase-config.js</p>
      <button type="button" class="ghost light" id="newbtn">+ Ny kunde</button>
      <button type="button" class="ghost light" id="seed">Opret testkunder</button>
      <div id="createwrap" class="xlwiz hidden">
      <section class="xlbox create-box" id="create">
        <h2>Ny kunde</h2>
        <div class="grid2">
        <label>CVR-nummer <input id="cvr" placeholder="8 cifre" /></label>
        <label>Firmanavn / pizzeria <input id="cname" /></label>
        <label>Adresse <input id="caddr" /></label>
        <label>Postnr. <input id="czip" maxlength="4" placeholder="5471" /></label>
        <label>By <input id="ccity" /></label>
        <label>Landsdel
          <select id="cregion">
            <option>Nordjylland</option>
            <option>Midtjylland</option>
            <option>Sønderjylland</option>
            <option>Fyn</option>
            <option>Sjælland</option>
            <option>Lolland-Falster</option>
            <option>Bornholm</option>
          </select>
        </label>
        <label>Telefon <input id="cphone" /></label>
        </div>
        <button type="button" class="ghost" id="cvrbtn">Slå CVR op</button>
        <h3>Skærme hos kunden</h3>
        <label>Antal skærme
          <select id="cscreens">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
          </select>
        </label>
        <div id="cscrrows"></div>
        <p class="muted">Pixels kan du altid rette selv. Model er kun et forslag.</p>
        <p class="muted">send-til-tv.html kører ved siden af, ikke her.</p>
        <div class="row-between">
          <button type="button" class="ghost" id="closecreate">Annuller</button>
          <button type="button" class="primary" id="createbtn">Opret kunde</button>
        </div>
        <p id="cmsg"></p>
      </section>
      </div>
      <div id="list" class="cust-list"></div>
    </aside>
    <div class="main">
      <div id="map"></div>
      <section class="panel hidden" id="panel">
        <button type="button" class="close" id="close">Luk</button>
        <h2 id="pname"></h2>
        <p id="pcity" class="muted"></p>
        <div id="pscreens" class="screens"></div>
        <p class="tv-url muted" id="tvurl"></p>
        <div id="paircodes" class="paircodes"></div>
        <button type="button" class="ghost" id="placebtn">Placer kunden på kortet</button>
        <p class="muted" id="placehint"></p>
        <button type="button" class="primary" id="viewmenu">Vis menukort</button>
        <button type="button" class="ghost" id="cvrupd">Opdater fra CVR</button>
        <label>Firmanavn <input id="ename" /></label>
        <label>Adresse <input id="eaddr" /></label>
        <label>Postnr. <input id="ezip" maxlength="4" placeholder="5471" /></label>
        <label>By <input id="ecity" /></label>
        <label>Landsdel
          <select id="eregion">
            <option>Nordjylland</option>
            <option>Midtjylland</option>
            <option>Sønderjylland</option>
            <option>Fyn</option>
            <option>Sjælland</option>
            <option>Lolland-Falster</option>
            <option>Bornholm</option>
          </select>
        </label>
        <label>Antal skærme <input id="escreens" type="number" min="1" /></label>
        <button type="button" class="ghost" id="copytv">Kopier menukort-link</button>
        <label>Telefon <input id="ephone" /></label>
        <label>Overskrift på TV <input id="venue" /></label>
        <label class="tick">Vis lysavis <input type="checkbox" id="etickon" /></label>
        <label>Lysavis-tekst <input id="ticker" /></label>
        <label>Note <input id="footerNote" /></label>
        <div class="row-between">
          <button type="button" class="ghost" id="add">Åbn menukort</button>
        </div>
        <div class="actions">
          <button type="button" class="primary" id="save">Gem og send</button>
          <button type="button" class="ghost" id="delcust">Slet kunde</button>
          <span id="msg"></span>
        </div>
      </section>
    </div>
  </div>
  <div id="studio" class="studio hidden">
    <div class="studio-bar">
      <div class="who">
        <strong>Menukort</strong>
        <span id="stitle" class="firm"></span>
        <small id="scvr"></small>
      </div>
      <button type="button" class="ghost" id="saddcol">+ Ny kolonne</button>
      <span class="labs">Skærme</span>
      <label class="tick hid"><input type="checkbox" id="has1" checked />1</label>
      <label class="tick hid"><input type="checkbox" id="has2" />2</label>
      <label class="tick hid"><input type="checkbox" id="has3" />3</label>
      <label class="tick hid"><input type="checkbox" id="has4" />4</label>
      <label class="tick hid"><input type="checkbox" id="has5" />5</label>
      <span id="stabs" class="stabs">
      <button type="button" class="tab on" data-scr="1">1</button>
      <button type="button" class="tab" data-scr="2">2</button>
      <button type="button" class="tab" data-scr="3">3</button>
      <button type="button" class="tab" data-scr="4">4</button>
      <button type="button" class="tab" data-scr="5">5</button>
      </span>
      <label>Px <input id="spx" type="number" value="1920" style="width:90px" /> × <input id="spy" type="number" value="1080" style="width:90px" /></label>
      <button type="button" class="ghost" id="sfilebtn">Upload Excel</button>
      <input type="file" id="sfile" accept=".xlsx,.xls,.csv" hidden />
      <button type="button" class="ghost" id="sbgbtn">Baggrund</button>
      <input type="file" id="sbg" accept="image/*" hidden />
      <label>TV-tekst
        <select id="sscale">
          <option value="80">80 %</option>
          <option value="90" selected>90 %</option>
          <option value="100">100 %</option>
        </select>
      </label>
      <label class="tick"><input type="checkbox" id="sticker" /> Vis lysavis</label>
      <button type="button" class="ghost" id="scopy">Kopiér til næste skærm</button>
      <span id="sstatus" class="draft">Kladde — ikke sendt</span>
      <button type="button" class="ghost" id="sview">Vis menukort</button>
      <button type="button" class="go" id="ssave">Send til TV</button>
      <button type="button" class="ghost" id="sclose">Luk</button>
    </div>
    <div id="scols" class="col-board"></div>
  </div>
  <div id="xlwiz" class="xlwiz hidden">
    <div class="xlbox">
      <h3>Sådan skal Excel læses</h3>
      <p id="xlhint"></p>
      <label>Hvilken kolonne?
        <select id="xlcol"><option value="ny">Ny kolonne</option></select>
      </label>
      <label>Start i nr. <input id="xlstart" placeholder="13" /></label>
      <label>Hvor mange priser?
        <select id="xlcount">
          <option value="1">1 pris</option>
          <option value="3">3 størrelser</option>
          <option value="5">5 størrelser</option>
        </select>
      </label>
      <label>Størrelser (kommasepareret) <input id="xllabs" value="Alm, Deep pan, Familie" /></label>
      <div class="row-between">
        <button type="button" class="ghost" id="xlcancel">Annuller</button>
        <button type="button" class="primary" id="xldo">Læg ind</button>
      </div>
    </div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="firebase-config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
